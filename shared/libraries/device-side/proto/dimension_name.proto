syntax = "proto3";

package com.android.adservices.shared.proto;
option java_multiple_files = true;
option java_package = "com.android.adservices.shared.proto";

// Defines the dimensions used for sampling events.
enum DimensionName {
  UNKNOWN = 0;
  // CEL
  CEL_ERROR_CODE = 1;
  CEL_PPAPI_NAME = 2;

  // AdServicesApiCalled
  API_CALLED_API_NAME = 3;
}