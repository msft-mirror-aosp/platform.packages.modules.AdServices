syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.android.adservices.service.proto";

// AdIdStorage store the current AdId data in the device
message AdIdStorage {
    // AdId string, 128 bit string of letter and number, e.g. 123e4567-e89b-12d3-a456-426614174000
    // It will be zero out when limit_ads_tracking is true.
    optional string ad_id = 1;

    // is user enable limit ads tracking
    optional bool limit_ads_tracking = 2;
}