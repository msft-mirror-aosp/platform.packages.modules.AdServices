syntax = "proto3";

package com.android.adservices.service.proto.config_delivery;

option java_multiple_files = true;

// Proto containing the data required to download the Argon Config Delivery
// (ACD) configs through Mobile Data Download (MDD).
// go/argon-configurations-delivery-system-design.
message MddConfigs {
  message MddConfig {
    // Should be unique within the argon mdd configs.
    // (This will be prefixed by an argon specific string, (eg, "ARGON_CONFIG_")
    // before passing to MDD).
    optional string manifest_id = 1;

    // Latest MDD manifest url for the config.
    optional string manifest_url = 2;

    // Whether the config should be downloaded before user consent to enabling
    // Privacy Sandbox.
    optional bool is_download_pre_consent = 3;

    // List of file group names that should be downloaded for this config.
    repeated string file_group_names = 4;
  }

  repeated MddConfig mdd_configs = 1;
}
